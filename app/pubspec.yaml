name: envventory
description: Inventory & sales management for building materials — Togo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Local database (offline-first)
  drift: ^2.22.1
  drift_flutter: ^0.2.3
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.1

  # HTTP
  dio: ^5.8.0+1

  # Auth & security
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  shimmer: ^3.0.0

  # Printing
  pdf: ^3.11.2
  printing: ^5.14.2

  # Sharing
  share_plus: ^10.1.4

  # Excel export
  excel: ^4.0.6

  # Utils
  intl: ^0.20.1
  uuid: ^4.5.1
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/

